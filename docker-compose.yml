
services:
  postgres:
    image: postgres:16
    restart: always
    container_name: bd_cornejo
    environment:
      POSTGRES_USER: cornejo
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cornejo
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres:
